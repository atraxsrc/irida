[package]
name = "irida"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irida-core = { path = "../irida-core" }
clap.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed", default-features = false, features = ["winit", "wayland", "tokio", "xdg-portal", "dbus-config", "about"] }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
