[package]
name = "irida-applet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Apply a saved Irida palette from the COSMIC panel"
homepage = "https://github.com/atraxsrc/irida"
repository = "https://github.com/atraxsrc/irida"

[dependencies]
irida-core = { path = "../irida-core" }
cosmic-config.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed", default-features = false, features = ["applet-token", "tokio"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
