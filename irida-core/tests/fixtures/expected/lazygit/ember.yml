# Ember (dark) for lazygit, written by Irida. Only the colours:
# your own config.yml keeps the rest. Read next to config.yml through
# LG_CONFIG_FILE, which the zsh/ember.zsh layer sets; another shell needs
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/ember.yml"
gui:
  theme:
    activeBorderColor:
      - "#E8713A"
      - bold
    inactiveBorderColor:
      - "#4F535A"
    searchingActiveBorderColor:
      - "#D9A441"
      - bold
    optionsTextColor:
      - "#7C8290"
    selectedLineBgColor:
      - "#633B2C"
    inactiveViewSelectedLineBgColor:
      - "#2E3137"
    cherryPickedCommitFgColor:
      - "#1B1E24"
    cherryPickedCommitBgColor:
      - "#D9A441"
    markedBaseCommitFgColor:
      - "#1B1E24"
    markedBaseCommitBgColor:
      - "#8FB58A"
    unstagedChangesColor:
      - "#D85A5A"
    defaultFgColor:
      - "#D6D9E0"
  authorColors:
    "*": "#D9A441"
