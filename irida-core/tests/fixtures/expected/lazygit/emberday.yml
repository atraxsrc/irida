# Ember Day (light) for lazygit, written by Irida. Only the colours:
# your own config.yml keeps the rest. Read next to config.yml through
# LG_CONFIG_FILE, which the zsh/emberday.zsh layer sets; another shell needs
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/emberday.yml"
gui:
  theme:
    activeBorderColor:
      - "#A4441A"
      - bold
    inactiveBorderColor:
      - "#B4B2AE"
    searchingActiveBorderColor:
      - "#8A5E12"
      - bold
    optionsTextColor:
      - "#6B6F78"
    selectedLineBgColor:
      - "#C9A591"
    inactiveViewSelectedLineBgColor:
      - "#CBC8C2"
    cherryPickedCommitFgColor:
      - "#DDD9D1"
    cherryPickedCommitBgColor:
      - "#8A5E12"
    markedBaseCommitFgColor:
      - "#DDD9D1"
    markedBaseCommitBgColor:
      - "#4C6B45"
    unstagedChangesColor:
      - "#9E3A3A"
    defaultFgColor:
      - "#2B2E36"
  authorColors:
    "*": "#8A5E12"
