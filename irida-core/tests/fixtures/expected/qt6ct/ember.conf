# Ember (dark) colour scheme for qt5ct / qt6ct, written by Irida.
# The window colour for windows, the containers for buttons and tooltips, the
# text colour, the accent as highlight with the background colour on it.
# Qt apps read it with QT_QPA_PLATFORMTHEME=qt5ct or qt6ct in the environment.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#d6d9e0, #1b1e24, #4f535a, #383b43, #0f1014, #22262e, #d6d9e0, #e2e4e9, #d6d9e0, #0f1014, #15171c, #0f1014, #e8713a, #15171c, #e8713a, #e3906c, #1b1e24, #15171c, #1b1e24, #d6d9e0, #5a6070
disabled_colors=#5a6070, #1b1e24, #4f535a, #383b43, #0f1014, #22262e, #5a6070, #7c8290, #5a6070, #15171c, #15171c, #0f1014, #4f535a, #7c8290, #5a6070, #5a6070, #1b1e24, #15171c, #1b1e24, #d6d9e0, #4f535a
inactive_colors=#d6d9e0, #1b1e24, #4f535a, #383b43, #0f1014, #22262e, #d6d9e0, #e2e4e9, #d6d9e0, #0f1014, #15171c, #0f1014, #e8713a, #15171c, #e8713a, #e3906c, #1b1e24, #15171c, #1b1e24, #d6d9e0, #5a6070
