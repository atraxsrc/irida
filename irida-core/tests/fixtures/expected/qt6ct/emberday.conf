# Ember Day (light) colour scheme for qt5ct / qt6ct, written by Irida.
# The window colour for windows, the containers for buttons and tooltips, the
# text colour, the accent as highlight with the background colour on it.
# Qt apps read it with QT_QPA_PLATFORMTHEME=qt5ct or qt6ct in the environment.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#2b2e36, #ddd9d1, #ddd9d1, #ccc9c3, #cdcac4, #e2ded6, #2b2e36, #25272e, #2b2e36, #f3f1ed, #e9e6df, #cdcac4, #a4441a, #e9e6df, #a4441a, #803d22, #ddd9d1, #e9e6df, #ddd9d1, #2b2e36, #8c9099
disabled_colors=#8c9099, #ddd9d1, #ddd9d1, #ccc9c3, #cdcac4, #e2ded6, #8c9099, #6b6f78, #8c9099, #e9e6df, #e9e6df, #cdcac4, #b4b2ae, #6b6f78, #8c9099, #8c9099, #ddd9d1, #e9e6df, #ddd9d1, #2b2e36, #b4b2ae
inactive_colors=#2b2e36, #ddd9d1, #ddd9d1, #ccc9c3, #cdcac4, #e2ded6, #2b2e36, #25272e, #2b2e36, #f3f1ed, #e9e6df, #cdcac4, #a4441a, #e9e6df, #a4441a, #803d22, #ddd9d1, #e9e6df, #ddd9d1, #2b2e36, #8c9099
