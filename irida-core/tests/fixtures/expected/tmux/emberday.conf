# Ember Day (light) for tmux, written by Irida.
set -g status-style "bg=#DDD9D1,fg=#2B2E36"
set -g window-status-style "bg=#DDD9D1,fg=#6B6F78"
set -g window-status-current-style "bg=#E2DED6,fg=#A4441A,bold"
set -g window-status-activity-style "bg=#DDD9D1,fg=#8A5E12"
set -g pane-border-style "fg=#E2DED6"
set -g pane-active-border-style "fg=#A4441A"
set -g message-style "bg=#E2DED6,fg=#2B2E36"
set -g message-command-style "bg=#E2DED6,fg=#A4441A"
set -g mode-style "bg=#D1AD9A,fg=#2B2E36"
set -g display-panes-active-colour "#A4441A"
set -g display-panes-colour "#6B6F78"
set -g clock-mode-colour "#A4441A"
