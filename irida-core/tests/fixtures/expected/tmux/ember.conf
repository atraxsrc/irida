# Ember (dark) for tmux, written by Irida.
set -g status-style "bg=#1B1E24,fg=#D6D9E0"
set -g window-status-style "bg=#1B1E24,fg=#7C8290"
set -g window-status-current-style "bg=#22262E,fg=#E8713A,bold"
set -g window-status-activity-style "bg=#1B1E24,fg=#D9A441"
set -g pane-border-style "fg=#22262E"
set -g pane-active-border-style "fg=#E8713A"
set -g message-style "bg=#22262E,fg=#D6D9E0"
set -g message-command-style "bg=#22262E,fg=#E8713A"
set -g mode-style "bg=#5F3626,fg=#D6D9E0"
set -g display-panes-active-colour "#E8713A"
set -g display-panes-colour "#7C8290"
set -g clock-mode-colour "#E8713A"
