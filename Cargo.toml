[workspace]
members = ["irida-core", "irida", "irida-applet"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed", default-features = false }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed", default-features = false }
hex_color = { version = "3", features = ["serde"] }
minijinja = "2"
toml = "0.9"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
include_dir = "0.7"
nix = { version = "0.30", features = ["signal"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
